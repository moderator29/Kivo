name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Matches the "engines" field in package.json.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # KN-137. A renamed or deleted asset breaks a page at runtime with no
      # build-time signal at all — `next build` never resolves a string path
      # into public/, so /assets/icons/navigation/teams.webp is just a string
      # until a user's browser asks for it and gets a 404.
      - name: Assets
        run: npm run check:assets

      - name: Build
        run: npm run build
        env:
          # next build needs these at build time for static analysis / type
          # generation even though no real backend calls happen during CI — dummy
          # placeholder values are enough since no page in the App Router is
          # statically prerendered against live Supabase data at build time.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      # KN-134. Reads .next/build-manifest.json, so it must follow the build.
      # Every individual import looks cheap and none of them is ever the one
      # that made the app slow; this is what notices the total.
      - name: Bundle size
        run: npm run check:bundle
